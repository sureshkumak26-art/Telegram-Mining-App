name: CI
on:
  push:
    branches: [main, 'feature/**', 'fix/**']
  pull_request:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mining_app
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d mining_app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mining_app
          TELEGRAM_BOT_TOKEN: replace_me
